<style>
:root{
  --lino:#F6F4F0; --blanco:#FFFFFF; --tinta:#1F1F1D; --tinta-suave:#6B6862;
  --pino:#3E5747; --sobre-pino:#F6F4F0; --salvia:#DCE3DA; --arena:#D8CEC4;
  --linea:#D9D3CB; --cereza:#8E2F2C;
  --display:"Gilda Display","Cormorant Garamond",Georgia,serif;
  --sans:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --s1:8px; --s2:16px; --s3:24px; --s4:40px; --s5:64px; --s6:120px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);font-weight:300;font-size:17px;line-height:1.65;background:var(--lino);color:var(--tinta);overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
strong{font-weight:600}
.contenedor{width:min(1080px,100% - 32px);margin-inline:auto}
h1,h2,h3{font-family:var(--display);font-weight:400;color:var(--pino);line-height:1.05}
.mayus{text-transform:uppercase;letter-spacing:.02em}

/* Pastillas y botones */
.pastilla{display:inline-flex;align-items:center;justify-content:center;padding:6px 24px;border:1.5px solid var(--tinta);border-radius:999px;font-weight:600;font-size:16px;line-height:24px;color:var(--pino);background:transparent;text-align:center}
.pastilla.precio{font-size:24px;line-height:30px;padding:12px 44px}
.boton{display:inline-flex;align-items:center;justify-content:center;padding:14px 32px;border-radius:999px;font-weight:600;font-size:15px;letter-spacing:.02em;text-decoration:none;border:1.5px solid var(--pino);background:var(--pino);color:var(--sobre-pino);transition:background .2s,color .2s}
.boton:hover{background:#334a3c}
.boton.secundario{background:transparent;color:var(--pino)}
.boton.secundario:hover{background:var(--pino);color:var(--sobre-pino)}
.boton:focus-visible,.pastilla:focus-visible,summary:focus-visible,.item:focus-visible{outline:2px solid var(--pino);outline-offset:3px}

/* Navegación */
nav{position:sticky;top:0;z-index:40;background:rgba(246,244,240,.94);backdrop-filter:blur(6px);border-bottom:1px solid transparent;transition:border-color .3s}
nav.con-linea{border-color:var(--linea)}
nav .contenedor{display:flex;align-items:center;justify-content:space-between;height:72px;gap:var(--s2)}
.firma{text-decoration:none;display:flex;align-items:baseline;gap:10px}
.firma b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--pino)}
.firma span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-suave)}
.menu{display:flex;gap:26px;list-style:none;font-size:14px}
.menu a{text-decoration:none}
.menu a:hover{color:var(--pino)}
@media(max-width:860px){.menu{display:none}.firma span{display:none}}

/* Foto con recuadro de respaldo */
.foto{position:relative;background:var(--arena);aspect-ratio:4/5;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover}
.foto.vacia img{display:none}
.foto.vacia::after{content:attr(data-alt);position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:var(--s2);font-family:var(--display);font-size:15px;color:var(--tinta-suave)}

/* Portada estilo flyer */
.portada{padding:var(--s5) 0 var(--s6)}
.portada .rejilla{display:grid;grid-template-columns:1fr 1fr auto;gap:var(--s2);align-items:start;margin-top:var(--s4)}
.vertical{font-family:var(--display);color:var(--arena);font-size:clamp(110px,15vw,200px);line-height:.8;writing-mode:vertical-rl;transform:rotate(180deg);user-select:none;padding-left:var(--s2);text-transform:uppercase}
.portada h1{font-size:clamp(46px,8.5vw,96px);margin-top:var(--s5)}
.portada .bajada{font-family:var(--display);font-size:clamp(22px,2.6vw,28px);color:var(--tinta);margin-top:var(--s1)}
.portada .lead{max-width:38rem;margin-top:var(--s3);font-size:19px}
.portada .lema{font-style:italic;color:var(--tinta-suave);margin-top:var(--s1)}
.acciones{display:flex;flex-wrap:wrap;gap:12px;margin-top:var(--s4)}
@media(max-width:700px){.portada .rejilla{grid-template-columns:1fr 1fr}.vertical{display:none}}

/* Secciones */
section{padding:var(--s6) 0}
.cabeza{margin-bottom:var(--s5);max-width:42rem}
.cabeza h2{font-size:clamp(34px,5vw,52px)}
.cabeza p{margin-top:var(--s2);color:var(--tinta-suave)}
.fina{border-top:1px solid var(--linea)}
.suave{background:var(--salvia)}

/* Dos columnas texto + foto */
.dos{display:grid;grid-template-columns:1.1fr .9fr;gap:var(--s5);align-items:center}
.dos .texto p + p{margin-top:var(--s2)}
.dos .texto h2{font-size:clamp(34px,5vw,52px);margin-bottom:var(--s3)}
@media(max-width:760px){.dos{grid-template-columns:1fr;gap:var(--s4)}}

/* Propuesta de valor */
.valores{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--s4) var(--s3)}
.valor{border-top:1.5px solid var(--pino);padding-top:var(--s2)}
.valor h3{font-size:24px;margin-bottom:var(--s1)}
.valor p{font-size:16px;color:var(--tinta-suave)}

/* Inversión */
.inversion{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5);align-items:start}
.inversion h3{font-size:clamp(30px,4vw,42px);margin-bottom:var(--s3)}
.inversion ul{margin:var(--s3) 0 var(--s3) 20px}
.inversion li{padding:2px 0}
.reserva{font-size:15px;color:var(--tinta-suave);margin-bottom:var(--s4)}
.reserva strong{color:var(--pino)}
@media(max-width:760px){.inversion{grid-template-columns:1fr;gap:var(--s4)}}
.adicionales{margin-top:var(--s6)}
.adicionales h3{font-size:30px;margin-bottom:var(--s3)}
.tabla{width:100%;border-collapse:collapse}
.tabla td{padding:var(--s2) 0;border-top:1px solid var(--linea);vertical-align:top}
.tabla tr:last-child td{border-bottom:1px solid var(--linea)}
.tabla td:last-child{text-align:right;font-weight:600;color:var(--pino);white-space:nowrap;padding-left:var(--s3)}
.tabla small{display:block;color:var(--tinta-suave);font-size:14px}
.nota{margin-top:var(--s3);font-size:15px;color:var(--tinta-suave)}

/* Pasos */
.pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s5) var(--s4)}
.paso b{display:block;font-family:var(--display);font-weight:400;font-size:72px;line-height:1;color:var(--arena)}
.paso h3{font-size:24px;margin:var(--s1) 0}
.paso p{color:var(--tinta-suave);font-size:16px}
.paso p + p{margin-top:var(--s1)}
@media(max-width:860px){.pasos{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.pasos{grid-template-columns:1fr}}

/* Entrega */
.entrega{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--s2);margin-top:var(--s5)}
.entrega div{border:1.5px solid var(--tinta);border-radius:999px;padding:12px 24px;text-align:center;font-weight:400;font-size:15px}
.entrega + .nota{text-align:center}

/* Galería */
.galeria{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.galeria .item{cursor:zoom-in;border:0;padding:0;background:none;text-align:left;font:inherit;color:inherit}
.galeria .pie{font-size:13px;color:var(--tinta-suave);margin-top:6px}
@media(max-width:700px){.galeria{grid-template-columns:1fr 1fr}}

/* Acordeones (condiciones y preguntas) */
.acordeon details{border-top:1px solid var(--linea);padding:var(--s3) 0}
.acordeon details:last-child{border-bottom:1px solid var(--linea)}
.acordeon summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:var(--s2);font-family:var(--display);font-size:22px;color:var(--pino)}
.acordeon summary::-webkit-details-marker{display:none}
.acordeon summary::after{content:"+";font-family:var(--sans);font-weight:300}
.acordeon details[open] summary::after{content:"–"}
.acordeon p,.acordeon ul{margin-top:var(--s2);color:var(--tinta-suave);max-width:46rem}
.acordeon ul{padding-left:20px}
.acordeon li + li{margin-top:6px}

/* Contacto / cierre */
.contacto{background:var(--salvia);text-align:center}
.contacto h2{font-size:clamp(34px,5.5vw,60px);max-width:46rem;margin:var(--s3) auto var(--s3)}
.contacto p{max-width:34rem;margin:0 auto var(--s2)}
.contacto .boton{margin-top:var(--s3)}
.contacto .pagos{margin-top:var(--s4);font-size:13px;color:var(--tinta-suave)}
footer{padding:var(--s4) 0;font-size:13px;color:var(--tinta-suave)}
footer .contenedor{display:flex;flex-wrap:wrap;gap:var(--s2);justify-content:space-between}
footer a{margin-left:var(--s3);text-decoration:none}
footer a:hover{color:var(--pino)}

/* WhatsApp flotante */
.wa{position:fixed;right:18px;bottom:18px;z-index:60;width:56px;height:56px;border-radius:50%;background:var(--pino);display:grid;place-items:center;box-shadow:0 8px 20px -8px rgba(0,0,0,.35)}
.wa svg{width:28px;height:28px;fill:var(--sobre-pino)}

/* Volver arriba */
.arriba{position:fixed;right:22px;bottom:88px;z-index:60;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--pino);background:var(--lino);color:var(--pino);display:grid;place-items:center;text-decoration:none;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .3s,transform .3s,background .2s,color .2s}
.arriba.visible{opacity:1;pointer-events:auto;transform:none}
.arriba:hover{background:var(--pino);color:var(--sobre-pino)}
.arriba:focus-visible{outline:2px solid var(--pino);outline-offset:3px}
.arriba svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* Fotos de portada que abren una sesión */
.sesion{position:relative;display:block;border:0;padding:0;background:none;cursor:pointer;font:inherit;color:inherit;text-align:left}
.sesion .ver{position:absolute;left:12px;bottom:12px;padding:6px 16px;border-radius:999px;background:rgba(246,244,240,.92);color:var(--pino);font-size:13px;font-weight:600;transition:background .2s,color .2s}
.sesion:hover .ver{background:var(--pino);color:var(--sobre-pino)}
.sesion:focus-visible{outline:2px solid var(--pino);outline-offset:3px}

/* Visor de fotos */
.visor{position:fixed;inset:0;background:var(--lino);z-index:100;display:none;grid-template-rows:auto 1fr auto auto;gap:12px;padding:16px 16px 20px}
.visor.abierto{display:grid}
.visor .barra{display:flex;justify-content:space-between;align-items:center;gap:16px}
.visor .titulo{font-family:var(--display);font-size:20px;color:var(--pino)}
.visor .contador{font-size:14px;color:var(--tinta-suave);margin-left:10px;font-family:var(--sans)}
.visor .escena{position:relative;min-height:0;overflow:hidden}
.visor .escena img{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;width:auto;height:auto}
.visor button{background:none;border:0;color:var(--pino);font-size:40px;line-height:1;cursor:pointer;padding:8px 14px;font-family:var(--sans);font-weight:300}
.visor .ant,.visor .sig{position:absolute;z-index:1;top:50%;transform:translateY(-50%);background:rgba(246,244,240,.85);border-radius:50%;width:52px;height:52px;padding:0}
.visor .ant{left:0}.visor .sig{right:0}
.visor .pie{text-align:center;color:var(--tinta-suave);font-size:14px;min-height:20px}
.visor .minis{display:flex;gap:8px;justify-content:center;overflow-x:auto;padding:2px}
.visor .minis button{flex:0 0 auto;width:52px;height:64px;padding:0;border:1.5px solid transparent;opacity:.55;transition:opacity .2s;background:var(--arena)}
.visor .minis button.actual{border-color:var(--pino);opacity:1}
.visor .minis img{width:100%;height:100%;object-fit:cover}
.visor:not(.varias) .ant,.visor:not(.varias) .sig,.visor:not(.varias) .minis{display:none}
@media(max-width:600px){.visor .minis{justify-content:flex-start}.visor .ant,.visor .sig{width:44px;height:44px}}

.aparece{opacity:0;transform:translateY(18px);transition:opacity .9s,transform .9s}
.aparece.visto{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.aparece{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
</style>
</head>

      { p:"¿Pueden participar nuestras mascotas?", r:"¡Claro! Las mascotas son bienvenidas y cuentan dentro del número de integrantes incluidos en el paquete." },
      { p:"¿Cuánto tiempo dura la sesión?", r:"Hasta 60 minutos. Por eso es importante que todos estén listos al momento de iniciar." },
      { p:"¿Cuándo recibimos las fotografías?", r:"La galería privada de selección se comparte en un plazo de hasta 3 días hábiles después de la sesión. Una vez recibida la selección y confirmado el pago del saldo, la entrega final se realiza en un plazo de hasta 5 días hábiles." },
      { p:"¿Podemos comprar más fotografías?", r:"Sí. Puedes adquirir fotografías individuales, un paquete de 5 adicionales o la galería completa, que incluye hasta 40 fotografías en total." },
      { p:"¿Qué pasa si necesitamos cambiar la fecha?", r:"Se permite un cambio de fecha, sujeto a la disponibilidad de AMCA Studio." },
      { p:"¿Qué pasa si no podemos asistir?", r:"El anticipo no es reembolsable. Sin embargo, puedes transferir el espacio reservado a otra familia, previa verificación de la dirección y aceptación de las condiciones del servicio." }
    ],

    cierre: {
      titulo: "Tu hogar ya tiene el escenario. Nosotros llevamos la fotografía.",
      texto: "Esta Navidad, conserva esos momentos que hacen especial a tu familia. Reserva tu sesión fotográfica a domicilio con AMCA Studio.",
      boton: "Agenda por WhatsApp"
    }
  },

  retratos: {
    titulo: "Familias y retratos",
    texto: "Fotos tranquilas y naturales, en tu casa o en un lugar que signifique algo para ustedes."
  },

  galeria: [
    { foto:"fotos/sesion-1/02.jpg", pie:"Momentos en casa" },
    { foto:"fotos/sesion-2/03.jpg", pie:"Primera Navidad" },
    { foto:"fotos/sesion-1/04.jpg", pie:"Retrato" },
    { foto:"fotos/sesion-2/06.jpg", pie:"Mamá e hija" },
    { foto:"fotos/sesion-1/06.jpg", pie:"Toda la familia" },
    { foto:"fotos/sesion-2/05.jpg", pie:"Explorando" }
  ]
};
/* ═══════════════ FIN DEL CONTENIDO EDITABLE ═══════════════ */
</script>

<nav id="nav">
  <div class="contenedor">
    <a href="#inicio" class="firma"><b>AMCA Studio</b><span>Familias y retratos</span></a>
    <ul class="menu" id="menu"></ul>
  </div>
</nav>

<main id="app"></main>

<a class="wa" id="waFlotante" aria-label="Escribir por WhatsApp" target="_blank" rel="noopener">
  <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.7c-2 0-4-.5-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.7 10.7 0 1 1 16 26.7zm5.9-8c-.3-.2-1.9-1-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.8 8.8 0 0 1-4.4-3.8c-.3-.6.3-.5 1-1.7.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.3 1.4 3.5c.2.2 2.4 3.6 5.8 5.1 2.1.9 3 1 4 .8.7-.1 1.9-.8 2.2-1.5.3-.7.3-1.4.2-1.5-.1-.1-.3-.2-.6-.3z"/></svg>
</a>

<a class="arriba" id="arriba" href="#inicio" aria-label="Volver arriba">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</a>

<div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Galería de la sesión">
  <div class="barra"><div class="titulo"><span class="nom"></span><span class="contador"></span></div><button class="cerrar" aria-label="Cerrar">×</button></div>
  <div class="escena"><img alt=""><button class="ant" aria-label="Foto anterior">‹</button><button class="sig" aria-label="Foto siguiente">›</button></div>
  <div class="pie"></div>
  <div class="minis"></div>
</div>

<script>
const C = CONTENIDO, N = C.navidad;
const wa = (msg) => `https://wa.me/${C.whatsapp}?text=${encodeURIComponent(msg || C.mensajeWhatsApp)}`;
const foto = (src, alt) => `<div class="foto" data-alt="${alt}"><img src="${src}" alt="${alt}" loading="lazy" onerror="this.parentNode.classList.add('vacia')"></div>`;
const fotosDe = (s) => Array.from({length:s.cantidad},(_,i)=>({foto:`${s.carpeta}/${String(i+1).padStart(2,"0")}.jpg`, pie:s.nombre}));
const parrafos = (ps) => ps.map(p=>`<p>${p}</p>`).join("");
const menu = [];
let html = "";

if (N.activa) {
  menu.push(["#experiencia","La experiencia"],["#inversion","Inversión"],["#proceso","Proceso"]);
  html += `
  <header class="portada" id="inicio">
    <div class="contenedor">
      <span class="pastilla">${N.etiqueta}</span>
      <div class="rejilla">
        ${N.sesionesPortada.map((s,i)=>`<button class="sesion" data-s="${i}" aria-label="Ver la sesión ${s.nombre}, ${s.cantidad} fotos">${foto(fotosDe(s)[0].foto,s.nombre)}<span class="ver">Ver sesión · ${s.cantidad} fotos</span></button>`).join("")}
        <div class="vertical" aria-hidden="true">${N.palabraVertical}</div>
      </div>
      <h1 class="mayus">${N.titulo}</h1>
      <p class="bajada">${N.bajada}</p>
      <p class="lead">${N.gancho}</p>
      <p class="lema">${N.lema}</p>
      <div class="acciones">
        <a class="boton" href="${wa()}" target="_blank" rel="noopener">Consultar disponibilidad</a>
        <a class="boton secundario" href="#inversion">Ver inversión</a>
      </div>
    </div>
  </header>

  <section class="fina">
    <div class="contenedor dos">
      <div class="texto aparece"><h2 class="mayus">${N.concepto.titulo}</h2>${parrafos(N.concepto.parrafos)}</div>
      <div class="aparece">${foto(N.concepto.foto,"Familia en su hogar")}</div>
    </div>
  </section>

  <section class="suave">
    <div class="contenedor">
      <div class="cabeza aparece"><h2 class="mayus">Una sesión diseñada alrededor de tu familia</h2></div>
      <div class="valores">${N.valores.map(v=>`<div class="valor aparece"><h3>${v.t}</h3><p>${v.d}</p></div>`).join("")}</div>
    </div>
  </section>

  <section id="experiencia">
    <div class="contenedor dos">
      <div class="aparece">${foto(N.experiencia.foto,"Sesión en casa")}</div>
      <div class="texto aparece"><h2 class="mayus">${N.experiencia.titulo}</h2>${parrafos(N.experiencia.parrafos)}</div>
    </div>
  </section>

  <section id="inversion" class="fina">
    <div class="contenedor">
      <div class="cabeza aparece"><h2 class="mayus">Inversión</h2></div>
      <div class="inversion">
        <div class="aparece">
          <h3>Sesión Navidad en casa</h3>
          <span class="pastilla precio">${N.precio} ${N.moneda}</span>
          <ul>${N.incluye.map(x=>`<li>${x}</li>`).join("")}</ul>
          <p class="reserva">${N.reserva}</p>
          <a class="boton" href="${wa()}" target="_blank" rel="noopener">Reservar mi fecha</a>
        </div>
        <div class="aparece">${foto(N.fotoPaquete,"Sesión Navidad en casa")}</div>
      </div>
      <div class="adicionales aparece">
        <h3>Opciones adicionales</h3>
        <table class="tabla"><tbody>
          ${N.adicionales.map(a=>`<tr><td>${a.c}${a.d?`<small>${a.d}</small>`:""}</td><td>${a.v}</td></tr>`).join("")}
        </tbody></table>
        <p class="nota">${N.notaGrupos}</p>
      </div>
    </div>
  </section>

  <section id="proceso" class="fina">
    <div class="contenedor">
      <div class="cabeza aparece"><h2 class="mayus">Reserva y entrega</h2><p>Así funciona, paso a paso.</p></div>
      <div class="pasos">${N.pasos.map((s,i)=>`<div class="paso aparece"><b>0${i+1}</b><h3>${s.t}</h3>${parrafos(s.d)}</div>`).join("")}</div>
      <div class="entrega aparece">${N.entrega.map(e=>`<div>${e}</div>`).join("")}</div>
      <p class="nota aparece">${N.notaEntrega}</p>
    </div>
  </section>`;
} else {
  html += `
  <header class="portada" id="inicio">
    <div class="contenedor">
      <span class="pastilla">fotografía · ${C.ciudad}</span>
      <h1 class="mayus">${C.retratos.titulo}</h1>
      <p class="lead">${C.retratos.texto}</p>
      <div class="acciones"><a class="boton" href="${wa("Hola AMCA Studio, quiero cotizar una sesión de fotos")}" target="_blank" rel="noopener">Cotizar mi sesión</a></div>
    </div>
  </header>`;
}

menu.push(["#galeria","Galería"]);
html += `
<section id="galeria" class="fina">
  <div class="contenedor">
    <div class="cabeza aparece"><h2 class="mayus">${C.retratos.titulo}</h2><p>${C.retratos.texto}</p></div>
    <div class="galeria">${C.galeria.map((g,i)=>`<button class="item aparece" data-i="${i}" aria-label="Ver ${g.pie}">${foto(g.foto,g.pie)}<div class="pie">${g.pie}</div></button>`).join("")}</div>
  </div>
</section>`;

if (N.activa) {
  menu.push(["#preguntas","Preguntas"]);
  html += `
  <section id="preguntas" class="fina">
    <div class="contenedor">
      <div class="cabeza aparece"><h2 class="mayus">Preguntas frecuentes</h2></div>
      <div class="acordeon">${N.preguntas.map(q=>`<details><summary>${q.p}</summary><p>${q.r}</p></details>`).join("")}</div>
    </div>
  </section>

  <section id="condiciones" class="fina">
    <div class="contenedor">
      <div class="cabeza aparece"><h2 class="mayus">Condiciones del servicio</h2></div>
      <div class="acordeon">${N.condiciones.map(c=>`<details><summary>${c.t}</summary><ul>${c.items.map(i=>`<li>${i}</li>`).join("")}</ul></details>`).join("")}</div>
    </div>
  </section>`;
}

menu.push(["#contacto","Contacto"]);
html += `
<section class="contacto" id="contacto">
  <div class="contenedor">
    <span class="pastilla">${N.activa ? "navidad en casa" : "hablemos"}</span>
    <h2 class="mayus">${N.activa ? N.cierre.titulo : "Agenda tu sesión"}</h2>
    <p>${N.activa ? N.cierre.texto : "Escríbeme por WhatsApp y te envío la disponibilidad."}</p>
    <a class="boton" href="${wa()}" target="_blank" rel="noopener">${N.activa ? N.cierre.boton : "Escribir por WhatsApp"}</a>
    <div class="pagos">${C.pagos}</div>
  </div>
</section>

<footer><div class="contenedor">
  <span>© ${new Date().getFullYear()} AMCA Studio · ${C.ciudad}, Colombia</span>
  <span>${C.sitioMarcas?`<a href="${C.sitioMarcas}">Fotografía para marcas</a>`:""}${C.instagram?`<a href="${C.instagram}" target="_blank" rel="noopener">Instagram</a>`:""}${C.tiktok?`<a href="${C.tiktok}" target="_blank" rel="noopener">TikTok</a>`:""}${C.behance?`<a href="${C.behance}" target="_blank" rel="noopener">Behance</a>`:""}</span>
</div></footer>`;

document.getElementById("app").innerHTML = html;
document.getElementById("menu").innerHTML = menu.map(([h,t])=>`<li><a href="${h}">${t}</a></li>`).join("");
document.getElementById("waFlotante").href = wa();

/* Visor de fotos: sesiones de portada (varias fotos) y galería */
const visor=document.getElementById("visor"), vImg=visor.querySelector(".escena img"),
  vNom=visor.querySelector(".nom"), vCont=visor.querySelector(".contador"), vPie=visor.querySelector(".pie"), vMinis=visor.querySelector(".minis");
let lista=[], idx=0, esSesion=false;
function mostrar(i){
  idx=(i+lista.length)%lista.length;
  vImg.src=lista[idx].foto; vImg.alt=lista[idx].pie;
  vCont.textContent=lista.length>1?`${idx+1} / ${lista.length}`:"";
  vPie.textContent=esSesion?"":lista[idx].pie;
  vMinis.querySelectorAll("button").forEach((b,j)=>b.classList.toggle("actual",j===idx));
  const m=vMinis.children[idx]; if(m) m.scrollIntoView({block:"nearest",inline:"center"});
}
function abrir(nuevaLista,i,titulo,sesion){
  lista=nuevaLista; esSesion=!!sesion;
  vNom.textContent=titulo||"";
  visor.classList.toggle("varias",lista.length>1);
  vMinis.innerHTML=esSesion?lista.map((f,j)=>`<button aria-label="Foto ${j+1}"><img src="${f.foto}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"></button>`).join(""):"";
  vMinis.querySelectorAll("button").forEach((b,j)=>b.onclick=()=>mostrar(j));
  visor.classList.add("abierto"); document.body.style.overflow="hidden";
  mostrar(i); visor.querySelector(".cerrar").focus();
}
const cerrar=()=>{visor.classList.remove("abierto");document.body.style.overflow=""};
document.querySelectorAll(".sesion").forEach(b=>b.onclick=()=>{
  if(b.querySelector(".vacia"))return;
  const s=N.sesionesPortada[+b.dataset.s]; abrir(fotosDe(s),0,s.nombre,true);
});
document.querySelector(".galeria").addEventListener("click",e=>{
  const it=e.target.closest(".item"); if(!it||it.querySelector(".vacia"))return;
  abrir(C.galeria,+it.dataset.i,C.retratos.titulo,false);
});
visor.querySelector(".cerrar").onclick=cerrar;
visor.querySelector(".ant").onclick=()=>mostrar(idx-1);
visor.querySelector(".sig").onclick=()=>mostrar(idx+1);
visor.querySelector(".escena").addEventListener("click",e=>{if(e.target.classList.contains("escena"))cerrar()});
document.addEventListener("keydown",e=>{if(!visor.classList.contains("abierto"))return;
  if(e.key==="Escape")cerrar(); if(e.key==="ArrowLeft")mostrar(idx-1); if(e.key==="ArrowRight")mostrar(idx+1);});
/* Deslizar con el dedo en el celular */
let x0=null;
visor.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
visor.addEventListener("touchend",e=>{if(x0===null||lista.length<2)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)mostrar(idx+(dx<0?1:-1));x0=null},{passive:true});

/* Línea bajo el menú al bajar + aparición suave */
const nav=document.getElementById("nav");
const arriba=document.getElementById("arriba");
addEventListener("scroll",()=>{nav.classList.toggle("con-linea",scrollY>20);arriba.classList.toggle("visible",scrollY>innerHeight*.8)},{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("visto");io.unobserve(e.target)}}),{threshold:.1});
document.querySelectorAll(".aparece").forEach(el=>io.observe(el));
</script>
</body>
</html>
